name: Bug report / 不具合の報告
description: Something doesn't work as expected. / 思ったとおりに動かないとき
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or Japanese is fine. / 報告ありがとう！英語でも日本語でも大丈夫です。
        Logs may contain IP addresses on your home network. Feel free to replace them with `x.x.x.x`.
        ログには家のネットワークの IP アドレスが入ることがあります。気になるときは `x.x.x.x` などに書き換えてください。
  - type: textarea
    id: what
    attributes:
      label: What happened / 何が起きたか
      description: What you did, what you expected, and what happened instead (a screenshot helps). / 何をしたら、どうなるはずが、どうなったか（スクリーンショットがあると助かります）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版
      description: Shown on the panel's update card, or run `~/.local/bin/frame-mic-tuner --version` on the Frame. / パネルの更新の帯、または Frame で `~/.local/bin/frame-mic-tuner --version`
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App using the mic / 使っていたアプリ
      description: The app that was using the microphone when it happened. / 問題が起きたときにマイクを使っていたアプリ
      placeholder: "VRChat via Steam Link / Steam Link で VRChat"
  - type: textarea
    id: logs
    attributes:
      label: Logs / ログ
      description: |
        Run this on the Frame (Desktop Mode terminal or ssh) soon after the problem, and paste the output.
        問題が起きたあとすぐに Frame で（デスクトップモードの端末か ssh で）次を実行して、出てきた内容を貼ってください。
        `journalctl --user -u frame-mic-tuner --since "1 hour ago" --no-pager`
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else / そのほか
      description: Echo cancellation and noise suppression on/off, the noise filter strength, and your settings if you changed any (`~/.config/frame-mic-tuner/config.json`). / エコー除去・ノイズ除去のオン・オフ、ノイズ除去の強さ、変えた設定（`~/.config/frame-mic-tuner/config.json`）など

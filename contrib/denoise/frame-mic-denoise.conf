# Frame Mic Tuner が足すマイクのフィルター。PipeWire の別プロセス（pipewire -c このファイル）で動かし、
# Frame 内蔵マイクの smart filter として通り道に入る。PipeWire・WirePlumber の再起動は要らない。
# 置き場所: ~/.local/share/frame-mic-tuner/frame-mic-denoise.conf（install.sh が @PLUGIN_PATH@ を書き換えて置く）
# 動かすのは frame-mic-tuner-denoise.service。どれを通り道に入れるかは frame-mic-tracker.lua が決める
# （filters メタデータの filter.smart.disabled）。
# - 「一定の雑音を消す」ノイズ除去: WirePlumber の設定 frame-mic.steady-noise でオン・オフ。
#   強さは Frame Mic Tuner が、その場で書き換える（pw-cli set-param ... "denoise:Strength (dB)"）。
# - 自動音量調整なしのエコー除去: エコー除去がオンで frame-mic.auto-gain がオフのとき、Valve のエコー除去
#   （echo_cancel_*）の代わりに入る。WebRTC の自動音量調整は PipeWire が起動したときの設定でしか変えられないので、
#   切った版をもう 1 つ持っておく。

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Frame Mic Tuner steady-noise remover"
            media.name = "Frame Mic Tuner steady-noise remover"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = denoise
                        plugin = "@PLUGIN_PATH@"
                        label = frame_mic_denoise
                        control = { "Strength (dB)" = 20 }
                    }
                ]
            }
            capture.props = {
                node.name = "frame_mic_denoise_capture"
                node.passive = true
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name = "frame_mic_denoise_source"
                media.class = Audio/Source
                audio.channels = 1
                audio.position = [ MONO ]
                filter.smart = true
                filter.smart.name = frame-mic-tuner-denoise
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # 並び（アプリ寄りの最後）は frame-mic-tracker.lua が Valve のフィルターの filter.smart.after に
                # この名前を足して決める。WirePlumber は新しく来たフィルターを、ほかのフィルターの after に名前が
                # 無いかぎりマイク寄りに置くため、こちらの before / after だけでは並びが決まらない
                filter.smart.disabled = true
                # Valve のフィルターと同じ印: アプリ（Steam のマイクの一覧など）から見えなくなり、tracker が受け持つ
                steamos.mic_filter = true
            }
        }
    }
    # 自動音量調整なしのエコー除去。Valve の本体（/etc/pipewire/microphone-filter-chain/
    # microphone-filter-chain-echo-cancel-cpu.conf の echo_cancel_*）と同じ設定で、webrtc.gain_control2 だけ切る。
    # SteamOS の更新で Valve の設定が変わったら、ここも合わせる
    { name = libpipewire-module-echo-cancel
        args = {
            aec.args = {
                webrtc.noise_suppression = false
                webrtc.voice_detection = false
                webrtc.gain_control1.enabled = false
                webrtc.gain_control2.enabled = false
                webrtc.force_mono_echo_reference = true
                webrtc.aec3.custom = true
                webrtc.aec3.filter.refined.length_blocks = 9
                webrtc.aec3.filter.refined_initial.length_blocks = 5
                webrtc.aec3.filter.coarse.length_blocks = 9
                webrtc.aec3.filter.coarse_initial.length_blocks = 5
                webrtc.aec3.delay.num_filters = 1
                webrtc.aec3.delay.down_sampling_factor = 8
                webrtc.aec3.delay.detect_pre_echo = false
                webrtc.aec3.echo_model.model_reverb_in_nonlinear_mode = true
            }
            capture.props = {
                node.name = "frame_mic_ec_capture"
                node.passive = true
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                # 名前に filter と chain を入れる: Valve の spatial-node-config.lua は、既定の出力が Frame のスピーカーの
                # ときに出てきた出力のストリームを立体音響の filter-chain に通すが、名前に両方あるものは通さない
                node.name = "frame_mic_ec_filter_chain_playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            source.props = {
                node.name = "frame_mic_ec_source"
                node.description = "Frame Mic Tuner echo canceller (no auto gain)"
                audio.channels = 1
                audio.position = [ MONO ]
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = frame-mic-tuner-ec-source
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # Valve のエコー除去と同じ場所（EQ のアプリ寄り、Valve のノイズ除去と「一定の雑音を消す」のマイク寄り）。
                # EQ の after にこの名前を足すのは frame-mic-tracker.lua（上の「一定の雑音を消す」と同じ理由）
                filter.smart.after = [ filter-chain-ns frame-mic-tuner-denoise ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
            sink.props = {
                # 消す音（Frame のスピーカーに出す音）を受け取る側。Valve の本体と同じく、スピーカーの手前に入る
                node.name = "frame_mic_ec_sink"
                node.description = "Frame Mic Tuner echo canceller (speaker reference)"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = frame-mic-tuner-ec-sink
                filter.smart.target = { media.class = Audio/Sink, alsa.card_name = "SM8250 LPASS", device.profile.description = "Speaker playback" }
                filter.smart.after = [ filter-chain-sink ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
]

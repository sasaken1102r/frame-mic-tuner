# SPDX-License-Identifier: MIT
# Frame Mic Tuner の「一定の雑音を消す」ノイズ除去。PipeWire の別プロセス（pipewire -c このファイル）で動かし、
# Frame 内蔵マイクの smart filter として通り道に入る。PipeWire・WirePlumber の再起動は要らない。
# 置き場所: ~/.local/share/frame-mic-tuner/frame-mic-denoise.conf（install.sh が @PLUGIN_PATH@ を書き換えて置く）
# 動かすのは frame-mic-tuner-denoise.service。オン・オフは WirePlumber の設定 frame-mic.steady-noise を見て
# frame-mic-tracker.lua が決める（filters メタデータの filter.smart.disabled）。
# 強さは Frame Mic Tuner が、その場で書き換える（pw-cli set-param ... "denoise:Strength (dB)"）。

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Frame Mic Tuner steady-noise remover"
            media.name = "Frame Mic Tuner steady-noise remover"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = denoise
                        plugin = "@PLUGIN_PATH@"
                        label = frame_mic_denoise
                        control = { "Strength (dB)" = 20 }
                    }
                ]
            }
            capture.props = {
                node.name = "frame_mic_denoise_capture"
                node.passive = true
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name = "frame_mic_denoise_source"
                media.class = Audio/Source
                audio.channels = 1
                audio.position = [ MONO ]
                filter.smart = true
                filter.smart.name = frame-mic-tuner-denoise
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # 並び（アプリ寄りの最後）は frame-mic-tracker.lua が Valve のフィルターの filter.smart.after に
                # この名前を足して決める。WirePlumber は新しく来たフィルターを、ほかのフィルターの after に名前が
                # 無いかぎりマイク寄りに置くため、こちらの before / after だけでは並びが決まらない
                filter.smart.disabled = true
                # Valve のフィルターと同じ印: アプリ（Steam のマイクの一覧など）から見えなくなり、tracker が受け持つ
                steamos.mic_filter = true
            }
        }
    }
]
